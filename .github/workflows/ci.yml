name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-value: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # 3. Install Client Dependencies
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      # 4. Build Client (catches any compilation/Vite errors)
      - name: Build Client
        run: |
          cd client
          npm run build
